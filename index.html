<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Bhopal Air Quality Tomorrow | भोपाल की हवा कल</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
         :root {
            --bg: #f1f7f8;
            --card: #fff;
            --tx: #10243a;
            --mut: #5b6f82;
            --ac: #0e9f94;
            --bd: #d9e5ea;
            --inp: #f6fafb;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }
        
        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b1a2e;
                --card: #13294a;
                --tx: #eaf3fb;
                --mut: #9db2c6;
                --ac: #35d0c3;
                --bd: #24426a;
                --inp: #0f2340
            }
        }
        
        :root[data-theme="dark"] {
            --bg: #0b1a2e;
            --card: #13294a;
            --tx: #eaf3fb;
            --mut: #9db2c6;
            --ac: #35d0c3;
            --bd: #24426a;
            --inp: #0f2340
        }
        
        html {
            height: 100%;
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }
        
        * {
            box-sizing: border-box
        }
        
        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 16px/1.55 'Poppins', 'Noto Sans Devanagari', system-ui, sans-serif
        }
        
        .hero {
            background: linear-gradient(135deg, #0b2a4a, #0e9f94);
            color: #fff;
            padding: 26px 18px 70px
        }
        
        .w {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 16px
        }
        
        .hero .w {
            padding: 0
        }
        
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px
        }
        
        .lang {
            background: #ffffff26;
            border: 1px solid #ffffff66;
            color: #fff;
            border-radius: 99px;
            padding: 6px 16px;
            font: inherit;
            cursor: pointer
        }
        
        h1 {
            font-size: clamp(26px, 5vw, 40px);
            line-height: 1.25;
            margin: 20px 0 8px
        }
        
        .hero p {
            margin: 0;
            max-width: 620px;
            opacity: .92
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 8px 24px #0a1f3a1a
        }
        
        .main {
            margin-top: -48px
        }
        
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px
        }
        
        @media(max-width:760px) {
            .grid {
                grid-template-columns: 1fr
            }
        }
        
        h2 {
            font-size: 20px;
            margin: 0 0 10px
        }
        
        label {
            display: block;
            font-size: 13px;
            color: var(--mut);
            margin: 12px 0 4px
        }
        
        input[type=number],
        input[type=date] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--bd);
            border-radius: 10px;
            background: var(--inp);
            color: var(--tx);
            font: inherit
        }
        
        .days {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 12px
        }
        
        .btns {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            flex-wrap: wrap
        }
        
        button.go,
        button.ex {
            border: 0;
            border-radius: 12px;
            padding: 12px 20px;
            font-family: inherit;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer
        }
        
        .go {
            background: var(--ac);
            color: #04201e;
            flex: 1
        }
        
        .ex {
            background: var(--inp);
            color: var(--tx);
            border: 1px solid var(--bd)!important
        }
        
        .big {
            font-size: 64px;
            font-weight: 700;
            line-height: 1
        }
        
        .pill {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 99px;
            color: #10243a;
            font-weight: 700;
            margin-left: 8px;
            vertical-align: middle
        }
        
        .msg {
            background: var(--inp);
            border-radius: 12px;
            padding: 12px 14px;
            margin: 14px 0 8px
        }
        
        .warn {
            color: #b45309;
            font-size: 13px
        }
        
        .mut {
            color: var(--mut);
            font-size: 13px
        }
        
        .empty {
            color: var(--mut);
            text-align: center;
            padding: 50px 10px
        }
        
        section {
            margin-top: 22px
        }
        
        .sv {
            overflow-x: auto
        }
        
        .leg {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px
        }
        
        .leg span {
            flex: 1 1 130px;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            color: #10243a;
            text-align: center
        }
        
        .lr {
            display: flex;
            gap: 12px;
            align-items: center;
            margin: 8px 0
        }
        
        .lr span:first-child {
            flex: 0 0 150px;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            color: #10243a;
            font-size: 13px;
            font-weight: 600
        }
        
        .lr span:last-child {
            font-size: 14px
        }
        
        footer {
            margin: 30px 0 28px;
            text-align: center;
            color: var(--mut);
            font-size: 13px
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="w">
            <div class="top"><span data-i="tag"></span><button class="lang" id="lg"></button></div>
            <h1 data-i="title"></h1>
            <p data-i="sub"></p>
        </div>
    </header>

    <main class="w main">
        <div id="al"></div>
        <div class="grid">
            <div class="card" id="tod"></div>
            <div class="card" id="out"></div>
        </div>
        <section class="card">
            <h2 data-i="gr_h"></h2>
            <div class="sv" id="chart"></div>
        </section>
        <section class="card">
            <h2 data-i="sc_h"></h2>
            <div id="leg"></div>
        </section>
        <section class="card">
            <div class="msg" id="st"></div>
            <details id="ed">
                <summary data-i="edit" style="cursor:pointer;color:var(--ac);font-weight:600"></summary>
                <label data-i="date"></label><input type="date" id="dt">
                <p class="mut" data-i="tip" style="margin:12px 0 0"></p>
                <div class="days" id="days"></div>
                <div class="btns"><button class="go" id="go" data-i="go"></button><button class="ex" id="rf" data-i="rf"></button></div>
            </details>
            <div class="btns"><button class="ex" id="nt" data-i="nt"></button></div>
        </section>
        <footer>
            <div data-i="disc"></div>
            <div style="margin-top:6px" data-i="src"></div>
        </footer>
    </main>

            $("#st").textContent = t(stk);
            document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
            $("#lg").textContent = lg ? "English" : "हिन्दी";
            for (let k = 0; k < 7; k++) $("#dl" + k).textContent = lab(k + 1) + " · AQI";
            $("#leg").innerHTML = C.map(z => '<div class="lr"><span style="background:' + z[3] + '">' + z[lg] + ' · ' + z[4] + '</span><span>' + z[5 + lg] + '</span></div>').join("");
            render();
            chart();
        }

        const IX = [0, 50, 100, 200, 300, 400, 500],
            BPS = {
                p25: [0, 30, 60, 90, 120, 250, 380],
                p10: [0, 50, 100, 250, 350, 430, 510],
                no2: [0, 40, 80, 180, 280, 400, 500],
                so2: [0, 40, 80, 380, 800, 1600, 2000],
                o3: [0, 50, 100, 168, 208, 748, 1000],
                co: [0, 1, 2, 10, 17, 34, 50]
            };

        function si(k, v) {
            const b = BPS[k];
            if (v == null || isNaN(v)) return null;
            if (v >= b[6]) return 500;
            let i = 0;
            while (v > b[i + 1]) i++;
            return IX[i] + (v - b[i]) * (IX[i + 1] - IX[i]) / (b[i + 1] - b[i])
        }
        const sum = a => a.reduce((p, q) => p + q, 0);
        async function live(q) {
            if (!q) {
                stk = "st_load";
                $("#st").textContent = t(stk);
                render()
            }
            try {
                const u = (CFG.apiKey ? "https://customer-air-quality-api.open-meteo.com" : "https://air-quality-api.open-meteo.com") + "/v1/air-quality?latitude=" + CFG.lat + "&longitude=" + CFG.lon + "&hourly=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone&past_days=8&forecast_days=1&timezone=Asia%2FKolkata" + (CFG.apiKey ? "&apikey=" + CFG.apiKey : "");
                const r = await fetch(u);
                if (!r.ok) throw 0;
                const h = (await r.json()).hourly;
                const now = new Date(Date.now() + 19800000).toISOString(),
                    today = now.slice(0, 10),
                    ds = n => new Date(Date.parse(today) - n * 864e5).toISOString().slice(0, 10);
                const A = ix => {
                    const avg = a => {
                        const s = ix.map(i => a[i]).filter(x => x != null);
                        return s.length >= 18 ? sum(s) / s.length : null
                    };
                    const m8 = a => {
                        let m = null;
                        for (const i of ix) {
                            const s = a.slice(Math.max(0, i - 7), i + 1).filter(x => x != null);
                            if (s.length >= 6) {
                                const v = sum(s) / s.length;
                                if (m == null || v > m) m = v
                            }
                        }
                        return m
                    };
                    const co = m8(h.carbon_monoxide),
                        s = [si("p25", avg(h.pm2_5)), si("p10", avg(h.pm10)), si("no2", avg(h.nitrogen_dioxide)), si("so2", avg(h.sulphur_dioxide)), si("o3", m8(h.ozone)), si("co", co == null ? null : co / 1000)],
                        ok = s.filter(x => x != null);
                    return ok.length >= 3 && (s[0] != null || s[1] != null) ? Math.round(Math.max(...ok)) : null
                };
                const day = d => A(h.time.map((x, i) => x.startsWith(d) ? i : -1).filter(i => i >= 0));
                let v = [1, 2, 3, 4, 5, 6, 7].map(n => day(ds(n))),
                    good = v.filter(x => x != null);
                if (good.length < 4) throw 0;
                const mean = Math.round(sum(good) / good.length);
                v = v.map(x => x == null ? mean : x);
                const ni = h.time.indexOf(now.slice(0, 13) + ":00");
                NOW = ni < 0 ? null : A(Array.from({
                    length: 24
                }, (_, k) => ni - 23 + k).filter(i => i >= 0));
                UPD = new Date();
                $("#dt").value = today;
                v.forEach((z, k) => $("#d" + k).value = z);
                calc();
                stk = "st_ok";
                $("#st").textContent = t(stk);
                try {
                    if (last.p > 200 && NF !== today && Notification.permission === "granted") {
                        new Notification(t("al_hi"));
                        NF = today
                    }
                } catch (e) {}
            } catch (e) {
                if (!q) {
                    stk = "st_fail";
                    $("#st").textContent = t(stk);
                    $("#ed").open = true;
                    render()
                }
            }
        }
        const dd = $("#days");
        for (let k = 0; k < 7; k++) dd.insertAdjacentHTML("beforeend", '<div><label id="dl' + k + '"></label><input type="number" id="d' + k + '" min="0" max="500" inputmode="numeric"></div>');
        $("#dt").value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
        $("#dt").onchange = () => {
            if (last && !last.err) calc()
        };
        $("#go").onclick = calc;
        $("#rf").onclick = () => live();
        $("#nt").onclick = () => {
            try {
                Notification.requestPermission()
            } catch (e) {}
        };
        $("#lg").onclick = () => {
            lg = 1 - lg;
            try {
                localStorage.setItem("lg", lg)
            } catch (e) {}
            lang()
        };
        lang();
        live();
        setInterval(() => live(1), 9e5);
    </script>
</body>

</html>
